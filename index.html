<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class= "bg-slate-100 h-[100vh] flex flex-col justify-center items-center font-poppins">
    
    <div class="h-[130px] w-[300px] bg-[url('./assets/bg.png')] bg-cover flex justify-center items-center">
        <img src="./assets/Group.png" alt="">
 
</div>
    <form class="bg-white p-5 rounded-2xl w-[350px]" action="">
        <div>

            <fieldset class="fieldset">
                <legend class="fieldset-legend font-bold">Mobile Number</legend>
                <input type="text" class="input rounded-2xl border-0 bg-slate-100" id="mobileNumber" placeholder="Enter your Number" />

            </fieldset>

        </div>
        <div>

            <fieldset class="fieldset">
                <legend class="fieldset-legend font-bold">4 Digit Pin</legend>
                <input type="text" class="input rounded-2xl border-0 bg-slate-100" id="pinNumber" placeholder="Enter 4 digit pin" />

            </fieldset>

        </div><br>
        <button type="button" class="btn btn-xs sm:btn-sm md:btn-md lg:btn-lg xl:btn-xl w-full bg-blue-500 text-white  font-bold rounded-2xl h-[40px]" id="loginBtn" >Login</button>
       
    </form>
   <!-- js script -->
    <script src="index.js"></script>
</body>

</html>
